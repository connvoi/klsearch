# KnowledgeSeeker - ソース設定ファイル
# 収集するRSSフィードとWebページを設定します

rss:
  - name: "simonwillison"
    url: "https://simonwillison.net/atom/everything/"
    fetch_full_content: true  # RSSの要約が短い場合、元ページから全文取得

  - name: "openai"
    url: "https://openai.com/news/rss.xml"
    fetch_full_content: true  # RSSの要約が短い場合、元ページから全文取得

  - name: "GitHub Blog"
    url: "https://github.blog/feed/"
    fetch_full_content: true  # RSSの要約が短い場合、元ページから全文取得

  - name: "ycombinator"
    url: "https://news.ycombinator.com/rss"
    fetch_full_content: true  # HN RSSは本文を含まないため必須

web:
  # 例: 特定のWebページを収集
  # 注意: anthropic.com はビルドごとにクラス名のハッシュが変わることがある。
  # 収集で「セレクタに一致する要素がありません」と出たらページを確認して更新する。
  - name: "anthropic"
    url: "https://www.anthropic.com/news/"
    selector: "_2Zn0cq_container"  # 記事リストのコンテナ (2026-11 時点)

  # 例: 特定のWebページを収集
  # - name: "Example Blog"
  #   url: "https://www.anthropic.com/news/"
  #   selector: "article.post"  # CSSセレクタで記事要素を指定

  # セレクタなしの場合、ページ全体を1つの記事として扱う
  # - name: "Single Page"
  #   url: "https://example.com/article"
